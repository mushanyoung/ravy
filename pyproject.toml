[project]
name = "ravy-checks"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = ["ruff==0.14.3", "mypy==1.18.2", "pyunpack==0.3", "json5==0.12.1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

follow_untyped_imports = true
mypy_path = "scripts"

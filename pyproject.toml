[project]
name = "ravy-checks"
version = "0.0.0"
requires-python = "==3.15.*"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.4", "mypy==2.4.1", "pyunpack==0.3", "json5==0.17.3"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py315"

[tool.ruff.per-file-target-version]
# Standalone commands may be launched by the system Python in a remote pane.
"bin/*" = "py39"
"chezmoi/dot_local/bin/*" = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.15"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

follow_untyped_imports = true
mypy_path = "scripts"
